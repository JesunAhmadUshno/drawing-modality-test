source:
  - changed-files:
      - any-glob-to-any-file: ["*.py", "analysis/**", "features/**"]
frontend:
  - changed-files:
      - any-glob-to-any-file: ["frontend/**"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**", "test_*.py"]
site:
  - changed-files:
      - any-glob-to-any-file: ["site/**"]
automation:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "README.md"]
